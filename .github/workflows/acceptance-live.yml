# Live acceptance tests against a real zone.eu zone.
#
# Manual only: these write real DNS records and spend a real rate-limit budget,
# so they must never run automatically on a pull request. Point them at a
# throwaway zone, never at one serving production traffic.
name: Live acceptance

on:
  workflow_dispatch:
    inputs:
      zone:
        description: 'Zone to test against (must be disposable)'
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go test ./internal/provider/ -run TestLive -v -timeout 30m
        env:
          ZONE_USERNAME: ${{ secrets.ZONE_USERNAME }}
          ZONE_API_TOKEN: ${{ secrets.ZONE_API_TOKEN }}
          ZONE_TEST_ZONE: ${{ inputs.zone }}
